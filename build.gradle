plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'me.atlas.bg2permfix'
base.archivesName = 'bg2permfix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:building-gadgets-298187:${bg2_file_id}")
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'bg2permfix',
            'Specification-Vendor': 'atlas',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'bg2permfix.mixins.json'
        )
    }
    finalizedBy 'reobfJar'
}
